# TLS-Decoded — single-file compose covering both halves of the system:
#   1. STATION services (db, api, poller, frontend, sync)
#   2. CLOUD HUB services (cloud-db, cloud-api, cloud-frontend)
#
# One command brings up whatever's enabled:
#   docker compose up -d --build
#
# ── Recommended: let install.sh drive this ──────────────────────────────────
# `./install.sh` asks what kind of deployment this box is and writes the
# right COMPOSE_PROFILES value into .env for you — see the Quick start /
# Deployment modes sections in README.md. It's re-runnable any time you want
# to change modes, rotate secrets, or reconfigure.
#
# ── Manual / no installer ────────────────────────────────────────────────────
# Compose profiles gate which services actually start. Set COMPOSE_PROFILES
# in .env to a comma-separated list of the profiles you want active:
#
#   station-core   db, api, poller, sync   — the station's own data pipeline
#   station-ui     frontend                 — the station's local dashboard
#   cloud          cloud-db, cloud-api, cloud-frontend — the cloud hub
#
# Deployment modes:
#   Local station only      → COMPOSE_PROFILES=station-core,station-ui
#   Cloud hub only           → COMPOSE_PROFILES=cloud
#   Poll-sync (no local UI)  → COMPOSE_PROFILES=station-core
#     (station data pipeline runs and pushes to a remote cloud, but nobody
#     views this station's own local dashboard — frontend stays off)
#   Complete / demo          → COMPOSE_PROFILES=station-core,station-ui,cloud
#
# A service with no `profiles:` key always starts regardless of
# COMPOSE_PROFILES — none are left that way here on purpose, so an empty/unset
# COMPOSE_PROFILES starts nothing rather than silently defaulting to "all."
#
# Config: copy .env.example to .env (or run install.sh, which does this for
# you) and fill in the values relevant to whichever profile(s) you're using —
# station vars for station-core/station-ui, CLOUD_* vars for cloud. Unused
# vars in .env are harmless.
#
# Note: if you later move the cloud hub to its own dedicated box (see
# CLOUD-ARCHITECTURE.md), cloud/docker-compose.cloud.yml is the same CLOUD
# HUB section as a fully standalone file — copy the cloud/ folder over and
# run that instead of maintaining two boxes off one edited copy of this file.

services:
  # ════════════════════════════════════════════════════════════════════════
  # STATION services — profile "station-core" (db/api/poller/sync) +
  # "station-ui" (frontend) kept separate so a poll-sync deployment can run
  # the data pipeline without exposing a local dashboard.
  # ════════════════════════════════════════════════════════════════════════

  db:
    image: postgres:16-alpine
    profiles: ["station-core", "station-ui"]
    environment:
      POSTGRES_DB: tls_decoded
      POSTGRES_USER: tls
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tls_local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tls -d tls_decoded"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    profiles: ["station-core", "station-ui"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tls:${DB_PASSWORD:-tls_local}@db:5432/tls_decoded
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-prod}
    volumes:
      - ./config:/app/config:ro
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  poller:
    build: ./poller
    profiles: ["station-core", "station-ui"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tls:${DB_PASSWORD:-tls_local}@db:5432/tls_decoded
      API_URL: http://api:8000
      # Override TLS host/port at runtime without editing the YAML:
      # TLS_HOST: 192.168.0.250
      # TLS_PORT: 5000
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production
    profiles: ["station-ui"]
    ports:
      - "${FRONTEND_PORT:-5005}:80"
    depends_on:
      - api
    restart: unless-stopped

  # Pushes this station's data to the cloud hub on a timer (default 30 min —
  # see CLOUD-ARCHITECTURE.md / cloud/README.md). Own container so a hung outbound push
  # can't affect on-site polling, same reasoning as api/poller being separate.
  # Only ever dials out; the station works fully standalone with this
  # container stopped or removed. Idle (and harmless) until it's configured
  # either way: the three STATION_*/CLOUD_INGEST_URL vars below (set once,
  # before first `up`), OR directly from the local dashboard's Settings ->
  # Cloud sync panel at any time after — both write to the same live-editable
  # settings table, so the dashboard path needs no restart. See cloud/README.md.
  # In "station-ui" profile too (not just station-core) so a full local
  # install always gets it — it's harmless idle weight either way.
  sync:
    build: ./sync
    profiles: ["station-core", "station-ui"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tls:${DB_PASSWORD:-tls_local}@db:5432/tls_decoded
      CLOUD_INGEST_URL: ${CLOUD_INGEST_URL:-}
      STATION_DEVICE_ID: ${STATION_DEVICE_ID:-}
      STATION_DEVICE_SECRET: ${STATION_DEVICE_SECRET:-}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-30}
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════
  # CLOUD HUB services — profile "cloud". See cloud/README.md for the full
  # picture (auth model, provisioning a station, staleness indicators, etc).
  # ════════════════════════════════════════════════════════════════════════

  cloud-db:
    image: postgres:16-alpine
    profiles: ["cloud"]
    environment:
      POSTGRES_DB: tls_decoded_cloud
      POSTGRES_USER: tls_cloud
      POSTGRES_PASSWORD: ${CLOUD_DB_PASSWORD:-tls_cloud_local}
    volumes:
      - cloud_pgdata:/var/lib/postgresql/data
    ports:
      - "${CLOUD_DB_PORT:-5433}:5432"   # distinct host port from the station db's 5432, so both can run on one box
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tls_cloud -d tls_decoded_cloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  cloud-api:
    build: ./cloud/cloud-api
    profiles: ["cloud"]
    depends_on:
      cloud-db:
        condition: service_healthy
    environment:
      CLOUD_DATABASE_URL: postgresql://tls_cloud:${CLOUD_DB_PASSWORD:-tls_cloud_local}@cloud-db:5432/tls_decoded_cloud
      # First-run convenience: if set and no admin exists yet, an initial T3
      # admin account is created automatically. Safe to leave set afterward
      # (no-op once an admin exists) — but rotate/remove once you've logged
      # in and created a real admin, since it lives in plain text in .env.
      ADMIN_EMAIL: ${CLOUD_ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${CLOUD_ADMIN_PASSWORD:-}
    ports:
      - "${CLOUD_API_PORT:-8100}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  cloud-frontend:
    build:
      context: ./cloud/cloud-frontend
      target: production
    profiles: ["cloud"]
    ports:
      - "${CLOUD_FRONTEND_PORT:-5100}:80"
    depends_on:
      - cloud-api
    restart: unless-stopped

volumes:
  pgdata:
  cloud_pgdata:
