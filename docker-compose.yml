services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tls_decoded
      POSTGRES_USER: tls
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tls_local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tls -d tls_decoded"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tls:${DB_PASSWORD:-tls_local}@db:5432/tls_decoded
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-prod}
    volumes:
      - ./config:/app/config:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  poller:
    build: ./poller
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tls:${DB_PASSWORD:-tls_local}@db:5432/tls_decoded
      API_URL: http://api:8000
      # Override TLS host/port at runtime without editing the YAML:
      # TLS_HOST: 192.168.0.250
      # TLS_PORT: 5000
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "5005:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
