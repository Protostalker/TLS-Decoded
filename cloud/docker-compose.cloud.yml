# TLS-Decoded Cloud Hub — Ingest API + T1/T2/T3 app API + cloud frontend.
#
# This is the entire deliverable that moves when HTS takes over hosting
# (see CLOUD-ARCHITECTURE.md's "Repo / deployment layout" section) — no
# code changes, just a different box and a real domain instead of the
# temporary DDNS one.
#
# Run standalone on whatever box is hosting the cloud hub:
#   cd cloud && docker compose -f docker-compose.cloud.yml up -d
#
# During the prototype phase, when the same box is both a station AND the
# temporary cloud hub, run both compose files together from the repo root:
#   docker compose -f docker-compose.yml -f cloud/docker-compose.cloud.yml up -d
#
# Config: copy cloud/.env.cloud.example to cloud/.env.cloud and fill it in
# (cloud-db password, admin bootstrap email/password). See cloud/README.md.

services:
  cloud-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tls_decoded_cloud
      POSTGRES_USER: tls_cloud
      POSTGRES_PASSWORD: ${CLOUD_DB_PASSWORD:-tls_cloud_local}
    volumes:
      - cloud_pgdata:/var/lib/postgresql/data
    ports:
      - "${CLOUD_DB_PORT:-5433}:5432"   # distinct host port from the station db's 5432, so both can run on one box
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tls_cloud -d tls_decoded_cloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  cloud-api:
    build: ./cloud-api
    depends_on:
      cloud-db:
        condition: service_healthy
    environment:
      CLOUD_DATABASE_URL: postgresql://tls_cloud:${CLOUD_DB_PASSWORD:-tls_cloud_local}@cloud-db:5432/tls_decoded_cloud
      # First-run convenience: if set and no admin exists yet, an initial T3
      # admin account is created automatically. Safe to leave set afterward
      # (no-op once an admin exists) — but rotate/remove once you've logged
      # in and created a real admin, since it lives in plain text in .env.cloud.
      ADMIN_EMAIL: ${CLOUD_ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${CLOUD_ADMIN_PASSWORD:-}
      # Licensing — see ../license-server/README.md and cloud-api/licensing.py.
      # One passphrase, always phoned home — no signing keys, no license
      # files. Point LICENSE_SERVER_URL at whichever license-server
      # instance this deployment should check against (the bundled one
      # below, or a separately-hosted one — cloud-api doesn't care which).
      # CLOUD_LICENSE_KEY only seeds the very first boot with an empty DB;
      # activate/replace from Admin -> License in the cloud frontend after that.
      CLOUD_LICENSE_KEY: ${CLOUD_LICENSE_KEY:-}
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-http://license-server:8000}
      LICENSE_CHECK_INTERVAL_HOURS: ${LICENSE_CHECK_INTERVAL_HOURS:-24}
      LICENSE_GRACE_DAYS: ${LICENSE_GRACE_DAYS:-45}
    ports:
      - "${CLOUD_API_PORT:-8100}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  cloud-frontend:
    build:
      context: ./cloud-frontend
      target: production
    ports:
      - "${CLOUD_FRONTEND_PORT:-5100}:80"
    depends_on:
      - cloud-api
    restart: unless-stopped

  # See ../license-server/README.md. Included here so a fully standalone
  # cloud-hub deployment (this file, on its own box) is self-contained —
  # comment this block out and set LICENSE_SERVER_URL above to point
  # elsewhere if licensing is hosted separately from the cloud hub itself.
  license-server:
    build: ../license-server
    environment:
      # Hash, not plaintext — see ../license-server/README.md's Key
      # management section and ../license-server/hash_secret.py.
      LICENSE_SERVER_ADMIN_TOKEN_HASH: ${LICENSE_SERVER_ADMIN_TOKEN_HASH:-}
      # Optional override for the auto-seeded master passphrase (default
      # "PermissionGranted200" if unset) — unlimited uses, never expires.
      MASTER_PASSPHRASE: ${MASTER_PASSPHRASE:-PermissionGranted200}
    volumes:
      - license_data:/data
    ports:
      - "${LICENSE_SERVER_PORT:-8200}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  cloud_pgdata:
  license_data:
